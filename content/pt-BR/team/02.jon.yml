name: Jon
role: Cofundador e Gerente de negócios
image: https://th.kanka.io/qj6BEWMKrn4D-9f5GMP_REpzsyQ=/200x200/smart/src/app/team/jon.jpg
experience: Só joga como Guerreiro

bio:
   - Não cheguei ao Kanka pelo worldbuilding. Eu vim de um mundo de processos rígidos, clientes exigentes e muito pouco senso de propósito. Vi o que Jay havia construído, vi o potencial, e o convenci de transformar isso em nossos empregos principais. O Kanka era uma oportunidade, mas a paixão veio depois.
   - "O que me transformou foram as pessoas. Logo no início, percebi algo que nunca tinha experimentado profissionalmente: usuários leais, gentis e genuinamente compreensivos quando as coisas não eram perfeitas. Depois comecei a descobrir a criatividade deles por meio dos nossos desafíos de worldbuilding, e honestamente, achei simplesmente incrível. Mundos inteiros com suas próprias histórias, idiomas, conflitos, todos construídos com tanto cuidado. Tudo isso mora de graça na minha cabeça."
   - Hoje em dia cuido do lado do storytelling do Kanka, descobrindo como explicar o que fazemos e por que isso importa. Acho que para quem tu construís molda tudo, e tivemos sorte com as pessoas que apareceram.
   - Quando não estou trabalhando, cozinho com o que minha horta hidropônica decide produzir (está ficando fora de controle), jogo videogame demais, e mais para o fim do ano vou ser pai pela primeira vez, o que suspeito vai acabar com tudo isso acima.

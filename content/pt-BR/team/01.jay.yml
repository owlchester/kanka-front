name: Jay
role: Fundador e Desenvolvedor principal
image: https://th.kanka.io/3gGetooEqoGcA-NFOPvu2xYX980=/200x200/smart/src/app/team/jay2.jpeg
experience: O Mestre eterno

bio:
  - Comecei o Kanka porque me cansei de passar metade do meu tempo de worldbuilding atualizando software de wiki e a outra metade realmente criando. Sete anos depois, ainda estou aqui, ainda lançando, ainda obcecado em encontrar o equilíbrio certo entre profundidade e simplicidade. Boas ferramentas não precisam fazer tudo, apenas as coisas que importam, e precisam fazê-las bem.
  - Construo o Kanka com tecnologia que não é das mais brilhantes, mas que eu sei que funciona e que não vai me acordar às 3h da manhã porque algo quebrou. Passo o resto do meu tempo me mantendo ativo, lendo, criando um filho pequeno e imaginando mundos.
  - Acho que problemas pessoalmente interessantes que servem a usuários reais ficam contigo por mais tempo do que qualquer obrigação. Quero que o Kanka ainda exista daqui a 10 anos. Isso significa lançar com cuidado e atenção aos detalhes, e evitar que a dívida técnica sugue a paixão. Alguns dias isso é mais difícil do que outros.

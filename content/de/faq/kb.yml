categories:
- category: "Allgemein"
  faqs:
    - question: "Kann ich mehrere Kampagnen haben?"
      answer: |
        Ja. Du kannst beliebig viele Kampagnen anlegen oder ihnen beitreten.

        Zum Wechseln öffnest du oben rechts den **<i class="fa-regular fa-grid" aria-hidden="true"></i> Kampagnenwechsler**. Unter der Liste findest du den Link **Neue Kampagne**.
    - question: "Kann ich eigene Kategorien anlegen?"
      answer: |
        Ja, in einer [Premium-Kampagne](/de/premium). Wie viele [benutzerdefinierte Kategorien](https://docs.kanka.io/en/latest/features/campaigns/categories.html) du anlegen kannst, hängt vom Abo ab.
    - question: "Wie kopiere ich eine ganze Kampagne?"
      answer: |
        Erstelle einen vollständigen [Kampagnenexport](https://docs.kanka.io/en/latest/features/campaigns/export.html) und importiere die Datei in eine neue Kampagne.
    - question: "Wie verknüpfe ich zwei Einträge?"
      answer: |
        Tippe im Editor `@` und mindestens drei Zeichen aus dem Namen des Eintrags. Wähle den passenden Treffer aus, um den Link einzufügen.

        In der [Dokumentation zu Erwähnungen](https://docs.kanka.io/en/latest/features/mentions.html) steht, wie du den Linktext änderst, auf eine Unterseite verlinkst oder die Trefferliste eingrenzt.
    - question: "Wie exportiere ich meine Kampagne?"
      answer: |
        Du kannst deine Kampagne einmal täglich exportieren. Du erhältst eine ZIP-Datei mit deinen Daten in JSON oder Markdown, je nachdem, welches Format du wählst.

        [So startest du einen Export](https://docs.kanka.io/en/latest/features/campaigns/export.html).
    - question: "Wozu kann ich Beziehungen und Eigenschaften anheften?"
      answer: |
        Angeheftete Beziehungen und Eigenschaften stehen rechts in der Übersicht des Eintrags. Öffne die Beziehung oder Eigenschaft zum Bearbeiten und aktiviere dort die Option zum Anheften.

        [Zur Dokumentation](https://docs.kanka.io/en/latest/features/profile-sidebar.html).
    - question: "Kann ich «Familien» in «Clans» umbenennen?"
      answer: |
        Ja, in einer [Premium-Kampagne](/de/premium). Öffne **Einstellungen** > **Kategorien** und klicke neben dem Namen der Kategorie auf «Bearbeiten».

        [Zur Dokumentation der Kategorien](https://docs.kanka.io/en/latest/features/campaigns/categories.html).
    - question: "Kann ich zwei Kampagnen synchronisieren?"
      answer: |
        Kanka synchronisiert Einträge zwischen Kampagnen nicht automatisch. Spielen mehrere Gruppen in derselben Welt, kannst du sie in einer Kampagne zusammenfassen und ihre Quests und Notizen mit Tags und Berechtigungen trennen.

        Einzelne oder mehrere Einträge kannst du [in eine andere Kampagne kopieren](https://docs.kanka.io/en/latest/guides/bulk.html).
    - question: "Wie leite ich mehrere Gruppen in derselben Welt?"
      answer: |
        Lade alle in dieselbe Kampagne ein und lege für jede Gruppe eine eigene Rolle an. So kannst du festlegen, welche Gruppe was sieht, und musst die Welt nur einmal pflegen.

        Mit einem eigenen Tag pro Gruppe findest du ihre Quests und Notizen leichter wieder.
    - question: "Wie verwende ich Textfilter?"
      answer: |
        In Listen kannst du mit diesen Zeichen genauer suchen.

        * `!...` schliesst Einträge aus, deren Feld den Suchtext enthält.
        * `...!` findet Einträge, deren Feld genau dem Suchtext entspricht.
        * `!!` findet Einträge, bei denen das Feld leer ist.

        Mit `;` kombinierst du Filter. `Alex;!Smith` sucht zum Beispiel nach «Alex» und schliesst «Smith» aus.

        Filter und Sortierung bleiben gespeichert, solange du angemeldet bist. Einen aktiven Filter kannst du kopieren und in einem Dashboard-Widget oder Lesezeichen wiederverwenden.
    - question: "Wie zeige ich alle Einträge ohne Untergruppen an?"
      answer: |
        Du kannst in deinen persönlichen Einstellungen oder in den Kampagneneinstellungen zwischen einer verschachtelten und einer einfachen Liste wechseln. Die Kampagneneinstellungen haben Vorrang.

        [Zur Dokumentation der verschachtelten Listen](https://docs.kanka.io/en/latest/features/nested.html).
    - question: "Wozu brauche ich eine Attributvorlage?"
      answer: |
        Stell dir vor, du willst für jede Stadt die Einwohnerzahl, das Klima und die Kriminalität festhalten. Lege eine Vorlage mit diesen drei Eigenschaften an und wende sie auf deine Städte an. Kanka fügt die Felder ein und du trägst nur noch die Werte ein.

        [Zur Videoanleitung](https://www.youtube.com/watch?v=qKnTpuePqUA).
- category: "Weltenbau"
  faqs:
    - question: "Wo lege ich Götter und Religionen an?"
      answer: |
        Du kannst Götter als [Charaktere](https://docs.kanka.io/en/latest/entries/characters.html) und Religionen als [Organisationen](https://docs.kanka.io/en/latest/entries/organisations.html) anlegen. Mit einem [Tag](https://docs.kanka.io/en/latest/entries/tags.html) oder einem [Lesezeichen](https://docs.kanka.io/en/latest/advanced/bookmarks.html) findest du sie schneller wieder.

        Wenn du ihnen einen eigenen Bereich geben möchtest, lege eine [benutzerdefinierte Kategorie](https://docs.kanka.io/en/latest/features/campaigns/categories.html) an.
    - question: "Wo lege ich Charakterklassen wie Waldläufer oder Kleriker an?"
      answer: |
        Lege die Klasse unter **Fähigkeiten** an. Die Fähigkeiten der Klasse kannst du ihr als Untereinträge zuordnen.
    - question: "Wie verwende ich Eigenschaften?"
      answer: |
        In einer Eigenschaft hältst du zum Beispiel die Trefferpunkte einer Figur oder die Einwohnerzahl einer Stadt fest. Mit `[entity:id]` verweist du auf einen Eintrag, mit `{Level}` auf eine andere Eigenschaft.

        `{Level}*{Con}` multipliziert die Werte dieser beiden Eigenschaften. Mit `floor({Level}/3)` rundest du ab, mit `ceil(({Con}*{Level})/2)` auf.

        Eine Attributvorlage kann auch einen Zufallswert ziehen. Mit `1-100` ziehst du eine Zahl zwischen 1 und 100. Mit `London, Berlin, Rome, Zürich` ziehst du einen Wert aus der Liste. Kanka bestimmt den Wert, wenn du die Vorlage anwendest oder den Eintrag speicherst.

        `{name}` gibt dir den Namen des Eintrags. Hat der Eintrag bereits eine Eigenschaft namens `name`, verwendet Kanka deren Wert.
    - question: "Kann ich einen Eintrag aus einer anderen Kampagne übernehmen?"
      answer: |
        Ja, wenn du Zugriff auf die Kampagne hast. Das gilt auch für öffentliche Kampagnen. Öffne das Menü «…», um einen einzelnen Eintrag zu kopieren, oder [kopiere mehrere auf einmal](https://docs.kanka.io/en/latest/guides/bulk.html).
- category: "Berechtigungen"
  faqs:
    - question: "Wie halte ich Informationen vor meiner Gruppe geheim?"
      answer: |
        Lade deine Gruppe ein, weise ihr Rollen zu und lege fest, was sie sehen oder bearbeiten darf. Wenn die Gruppe den Steckbrief einer Figur sehen darf, ihre Ziele aber geheim bleiben sollen, kannst du in ihrer Übersicht einen privaten **Beitrag** anlegen.

        [Zur Videoanleitung](https://www.youtube.com/watch?v=ikNPzNgjYmg&feature=emb_logo).
    - question: "Wer kann meine Kampagne sehen?"
      answer: |
        Kampagnen sind standardmässig privat. Sie sind nur für eingeladene Personen sichtbar. Das gilt auch für das Kanka-Team. Stellst du deine Kampagne auf öffentlich, können alle sehen, was du freigegeben hast.
- category: "Kalender"
  faqs:
    - question: "Wie zeige ich das Alter eines Charakters an?"
      answer: |
        Öffne beim Charakter **Erinnerungen** und lege im Kalender eine Erinnerung vom Typ **Geburt** oder **Tod** an. Mit dem Geburtsdatum zeigt Kanka das aktuelle Alter an. Mit beiden Daten zeigt Kanka das Alter beim Tod. Wenn nur das Todesdatum feststeht, zeigt Kanka die Zeit seit dem Tod an.

        Für Orte und Organisationen gibt es den Erinnerungstyp **Gründung**.

        [Zur Dokumentation der Altersangaben](https://docs.kanka.io/en/latest/advanced/age.html?highlight=sidebar).
- category: "Karten und Orte"
  faqs:
    - question: "Welche Bildformate kann ich für Karten verwenden?"
      answer: |
        Du kannst Karten als PNG, JPG, WebP oder SVG hochladen. Danach kannst du Ebenen und Gruppen anlegen und Marker mit Einträgen deiner Kampagne verknüpfen.

        [Zur Dokumentation der Karten](https://docs.kanka.io/en/latest/entries/maps.html).
    - question: "Wie mache ich eine Karte interaktiv?"
      answer: |
        Setze Marker auf deine Karte und verknüpfe sie mit den passenden Einträgen. Du kannst etwa eine Stecknadel, einen Kreis, eine Beschriftung oder ein Polygon verwenden. Wenn deine Gruppe einen Ort noch nicht entdeckt hat, kannst du den Marker privat halten.

        [Zur Dokumentation der Karten](https://docs.kanka.io/en/latest/entries/maps.html).
- category: "Konto"
  faqs:
    - question: "Wie lösche ich mein Konto?"
      answer: |
        Öffne deine [Kontoeinstellungen](https://app.kanka.io/settings/account#account-deletion) und gehe zum Abschnitt für die Kontolöschung. Der Vorgang löscht dein Konto und alle Kampagnen, in denen du das einzige Mitglied bist, **endgültig**.
    - question: "Wie lösche ich eine Kampagne?"
      answer: |
        Öffne im Seitenmenü der Kampagne **Einstellungen** und dann **Löschen**. Das löscht die Kampagne, ihre Daten und Bilder **endgültig**.
    - question: "Wie verbinde ich mein Kanka-Konto mit Discord?"
      answer: |
        Öffne in den Einstellungen [Apps](https://app.kanka.io/settings/apps) und klicke bei Discord auf **Verbinden**. Damit trittst du dem [Kanka-Server](/go/discord) bei und erhältst die Rollen für dein Abo.
- category: "Preise"
  faqs:
    - question: "Bleibt Kanka kostenlos?"
      answer: |
        Ja. Kampagnen und die Grundfunktionen bleiben kostenlos. Mit einem Abo kannst du unter anderem über Vorschläge abstimmen und [Premium-Kampagnen](/de/premium) freischalten.
    - question: "Was bedeutet Vorabzugang?"
      answer: |
        Mit einem Abo kannst du Funktionen im Vorabzugang 30 Tage lang ausprobieren, bevor sie für alle verfügbar sind.
    - question: "Was passiert, wenn meine Kampagne kein Premium mehr hat?"
      answer: |
        Die Daten zu den Premium-Funktionen bleiben gespeichert. Sobald du für die Kampagne wieder Premium aktivierst, werden sie wieder angezeigt.
    - question: "Welche Angaben zu meiner Karte bekommt Kanka?"
      answer: |
        [Stripe](https://stripe.com) verarbeitet die Zahlungen und kümmert sich um die Abrechnung. Wir erhalten die Kartenmarke, das Ablaufdatum und die letzten vier Ziffern. So können wir dich rechtzeitig erinnern, wenn du deine Karte aktualisieren musst.
- category: "Sonstiges"
  faqs:
    - question: "Kann ich Kanka auf dem Handy nutzen?"
      answer: |
        Ja, im Browser. Die Ansicht passt sich dem kleineren Bildschirm an. Du kannst dieselben Funktionen wie am Computer nutzen.
    - question: "Wie soll sich Kanka weiterentwickeln?"
      answer: |
        Wir wollen, dass du Kanka weiterhin mit den Regeln deiner Wahl nutzen kannst. In der [Plugin-Bibliothek](https://plugins.kanka.io) kann die Community eigene Designs, Charakterbögen und weitere Inhalte teilen.
    - question: "Wie oft sichert Kanka meine Daten?"
      answer: |
        Wir sichern die Daten zweimal täglich. Unsere eigenen Kampagnen liegen am selben Ort wie deine.
    - question: "Wie melde ich einen Fehler?"
      answer: |
        Komm auf unseren [Discord-Server](/go/discord) und beschreibe den Fehler im Kanal `#error-and-bugs`.
    - question: "Wie kann ich mithelfen?"
      answer: |
        Auf [Discord](/go/discord) kannst du dich melden, wenn du übersetzen, neue Funktionen testen oder Fragen von Einsteigern beantworten möchtest. Du kannst Kanka auch deiner Spielgruppe zeigen.

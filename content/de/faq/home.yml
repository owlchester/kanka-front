items:
  - id: free
    q: "Ist die kostenlose Version zeitlich begrenzt?"
    a: "Du kannst die kostenlose Version so lange nutzen, wie du möchtest. Alle Grundfunktionen sind dabei. Lege beliebig viele Kampagnen und Einträge an, ganz ohne Kreditkarte. Mit einem Abo kannst du unter anderem Kampagnen auf Premium umstellen und grössere Dateien hochladen."
  - id: ownership
    q: "Kann ich meine Kampagne exportieren?"
    a: "Ja. Deine Welt gehört dir, und du kannst deine gesamte Kampagne jederzeit exportieren."
  - id: system
    q: "Muss ich D&D spielen, um Kanka zu nutzen?"
    a: "Kanka funktioniert mit jedem Rollenspiel, auch mit deinen eigenen Regeln. Du kannst Kanka auch zum Schreiben nutzen oder damit eine Welt ausarbeiten, ganz ohne Spielregeln."
  - id: secrets
    q: "Kann ich Notizen vor meiner Runde verbergen?"
    a: "Ja. Wenn du deine Mitspieler einlädst, legst du fest, wer was sehen und bearbeiten darf. So kannst du etwa den Eintrag einer Figur teilen und ihre wahren Absichten für dich behalten."
  - id: started
    q: "Wie lange dauert der Einstieg?"
    a: "Ein paar Minuten reichen. Erstelle ein Konto und lege erste Einträge für Figuren und Orte an. Um einen Eintrag in deinen Notizen zu verlinken, tippe @ und den Namen des Eintrags."

items:
  - id: payments
    q: "Wie kann ich bezahlen?"
    a: "Wir akzeptieren die meisten Kredit- und Debitkarten, darunter Visa, Mastercard und American Express. Ein Jahresabo kannst du auch mit PayPal bezahlen."
  - id: info
    q: "Welche Zahlungsdaten speichert Kanka?"
    a: "Stripe wickelt deine Zahlungen ab. Wir speichern nur wenige Angaben zur Zahlungsmethode, damit wir dich zum Beispiel vor dem Ablauf deiner Karte informieren können. So kannst du sie rechtzeitig aktualisieren und dein Abo läuft weiter."
  - id: cancel
    q: "Was passiert, wenn ich mein Abo kündige?"
    a: "Du behältst alle Vorteile bis zum Ende des bereits bezahlten Zeitraums."
  - id: resub
    q: "Bekomme ich meine Daten zurück, wenn ich wieder ein Abo abschliesse?"
    a: "Wenn dein Abo endet, sind die zugehörigen Funktionen und Daten ausgeblendet. Die Daten bleiben gespeichert und sind wieder verfügbar, sobald du erneut ein Abo abschliesst."
  - id: refund
    q: "Wie beantrage ich eine Rückerstattung?"
    a: "Bei einem Jahresabo hast du 14 Tage Zeit, eine Rückerstattung zu beantragen. Schreib uns an <a href=\"mailto:hello@kanka.io\" class=\"link link-purple\">hello@kanka.io</a>. Du musst keinen Grund angeben."
  - id: gift
    q: "Kann ich ein Abo verschenken?"
    a: "Ein Abo bleibt an dein Konto gebunden. Du kannst damit Premium für jede Kampagne aktivieren, auf die du Zugriff hast. Das geht auch, wenn du dort keine Admin-Rechte hast oder kein Mitglied bist."

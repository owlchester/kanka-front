name: Jon
role: Mitgründer & Business Manager
image: https://th.kanka.io/qj6BEWMKrn4D-9f5GMP_REpzsyQ=/200x200/smart/src/app/team/jon.jpg
experience: Spielt ausschließlich als Kämpfer

bio:
   - Ich bin nicht durch Worldbuilding zu Kanka gekommen. Ich kam aus einer Welt starrer Prozesse, anspruchsvoller Kunden und sehr wenig Sinn für das Wesentliche. Ich habe gesehen, was Jay aufgebaut hatte, das Potenzial erkannt und ihn davon überzeugt, es zu unseren Hauptjobs zu machen. Kanka war eine Gelegenheit, aber die Leidenschaft kam später.
   - "Was mich verändert hat, waren die Menschen. Früh bemerkte ich etwas, das ich beruflich noch nie erlebt hatte: Nutzer, die loyal, freundlich und wirklich verständnisvoll waren, wenn Dinge nicht perfekt liefen. Dann begann ich, ihre Kreativität durch unsere Worldbuilding-Challenges zu entdecken, und ehrlich gesagt fand ich das einfach richtig cool. Ganze Welten mit ihrer eigenen Geschichte, eigenen Sprachen, Konflikten, alle mit so viel Sorgfalt aufgebaut. Das alles lebt mietfrei in meinem Kopf."
   - Heute kümmere ich mich um die Storytelling-Seite von Kanka und überlege, wie ich erklären kann, was wir machen und warum das wichtig ist. Ich denke, für wen du baust, prägt alles – und wir hatten Glück mit den Menschen, die sich gezeigt haben.
   - Wenn ich nicht arbeite, koche ich mit dem, was meine Hydroponik-Anlage gerade produziert (es gerät außer Kontrolle), spiele zu viele Videospiele, und später dieses Jahr werde ich zum ersten Mal Vater, was ich vermute, in all das hineinschneiden wird.

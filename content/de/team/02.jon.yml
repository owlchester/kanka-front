name: Jon
role: Mitgründer, zuständig für Kommunikation und Geschäftliches
image: /images/members/jon.png
experience: Spielt immer einen Kämpfer

bio:
  - Bevor ich zu Kanka kam, arbeitete ich in einem Umfeld mit starren Abläufen und anspruchsvoller Kundschaft. Wozu das alles gut war, fragte ich mich oft. Als ich sah, was Jay aufgebaut hatte, überzeugte ich ihn, Kanka zu unserem Hauptberuf zu machen. Am Anfang war das für mich eine Gelegenheit, beruflich etwas anderes zu machen. Die Begeisterung kam erst später.
  - Die Leute haben den Unterschied gemacht. Schon früh habe ich erlebt, wie treu und freundlich sie waren und wie gelassen sie blieben, wenn etwas nicht auf Anhieb klappte. Bei unseren Wettbewerben bekam ich dann zu sehen, was sie sich alles ausdenken. Ganze Welten mit eigener Geschichte, eigenen Sprachen und Konflikten, bis ins Detail ausgearbeitet. An einige davon denke ich heute noch.
  - Heute kümmere ich mich vor allem darum, verständlich zu erzählen, was wir bei Kanka machen und wozu es gut ist. Wer ein Werkzeug nutzt, prägt mit, was daraus wird. Mit den Leuten, die zu Kanka gekommen sind, hatten wir Glück.
  - Wenn ich nicht arbeite, koche ich mit dem, was in meinem Hydrokultur-Garten gerade wächst. Das Ganze nimmt langsam überhand. Ich spiele auch zu viele Videospiele. Später in diesem Jahr werde ich zum ersten Mal Vater. Dann bleibt für all das wohl weniger Zeit.

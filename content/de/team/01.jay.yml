name: Jay
role: Gründer & Lead-Entwickler
image: https://th.kanka.io/3gGetooEqoGcA-NFOPvu2xYX980=/200x200/smart/src/app/team/jay2.jpeg
experience: Der ewige Spielleiter

bio:
  - Ich habe Kanka ins Leben gerufen, weil ich es satt hatte, die Hälfte meiner Worldbuilding-Zeit damit zu verbringen, Wiki-Software zu aktualisieren, und die andere Hälfte wirklich zu erschaffen. Sieben Jahre später bin ich immer noch hier, liefere weiter, immer noch besessen davon, die richtige Balance zwischen Tiefe und Einfachheit zu finden. Gute Tools müssen nicht alles können, nur die Dinge, die wichtig sind – und die müssen sie gut machen.
  - Ich baue Kanka mit Technologie, die nicht glänzend ist, aber von der ich weiß, dass sie funktioniert und mich nicht um 3 Uhr morgens aufwecken wird, weil etwas kaputtgegangen ist. Den Rest meiner Zeit verbringe ich damit, aktiv zu bleiben, zu lesen, ein Kleinkind großzuziehen und mir Welten auszudenken.
  - Ich denke, dass persönlich interessante Probleme, die echten Nutzern dienen, länger bei dir bleiben als jede Verpflichtung. Ich möchte, dass Kanka in 10 Jahren noch existiert. Das bedeutet, sorgfältig und mit Liebe zum Detail zu liefern und zu verhindern, dass technische Schulden die Leidenschaft ausbrennen. Manche Tage ist das schwieriger als andere.

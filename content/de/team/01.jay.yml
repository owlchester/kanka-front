name: Jay
role: Gründer und leitender Entwickler
image: /images/members/jay.png
experience: Der ewige Spielleiter

bio:
  - Ich habe Kanka entwickelt, weil ich genauso viel Zeit damit verbrachte, mein Wiki zu pflegen, wie damit, mir meine Welt auszudenken. Auch heute arbeite ich noch an derselben Frage. Wie viel muss das Werkzeug können, damit ich eine komplexe Welt festhalten kann und mich trotzdem schnell zurechtfinde?
  - Für Kanka nutze ich Technik, die ich gut kenne und auf die ich mich verlassen kann. Ich möchte nicht um drei Uhr morgens einen Serverausfall beheben müssen. Sonst mache ich Sport, lese, kümmere mich um mein Kind und denke mir neue Welten aus.
  - Was mich bei der Sache hält, sind Probleme, die mich interessieren und deren Lösung anderen beim Spielen hilft. Kanka soll es auch in zehn Jahren noch geben. Deshalb nehme ich mir Zeit für die Details und versuche, den Code so zu schreiben, dass ich ihn auch später noch gerne anfasse. Das klappt an manchen Tagen besser als an anderen.

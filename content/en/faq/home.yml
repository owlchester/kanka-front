items:
  - id: free
    q: "Is the free plan really free, or just a trial?"
    a: "Free forever. Unlimited campaigns and entries, all core features, no credit card. Plenty of GMs never upgrade. Paid tiers add premium campaigns, bigger uploads, and a few extras"
  - id: ownership
    q: "Do I own my world? Can I get my data out?"
    a: "Yes. Your worlds are yours: export your whole campaign whenever you want"
  - id: system
    q: "Do I have to play D&D?"
    a: "Not at all. Kanka is an RPG campaign management tool that works with any TTRPG system, whether your own homebrew, or no system at all! Plenty of people use it purely for worldbuilding and writing"
  - id: secrets
    q: "Can I keep secrets from my players?"
    a: "Yes. Invite your players and control exactly what each person sees and edits. Your spoilers stay hidden until you're ready to reveal them"
  - id: started
    q: "How long does it take to get started?"
    a: "Minutes. Create an account, add a few characters and places, @mention to link them… you're building"
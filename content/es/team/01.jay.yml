name: Jay
role: Fundador y Desarrollador principal
image: https://th.kanka.io/3gGetooEqoGcA-NFOPvu2xYX980=/200x200/smart/src/app/team/jay2.jpeg
experience: El DM eterno

bio:
  - Empecé Kanka porque me cansé de pasar la mitad de mi tiempo de worldbuilding actualizando software de wiki y la otra mitad realmente creando. Siete años después, sigo aquí, sigo lanzando cosas, sigo obsesionado con encontrar el equilibrio correcto entre profundidad y simplicidad. Las buenas herramientas no necesitan hacer todo, solo las cosas que importan, y necesitan hacerlas bien.
  - Construyo Kanka con tecnología que no es la más brillante, pero que sé que funciona y que no me va a despertar a las 3am porque algo se rompió. El resto del tiempo lo paso manteniéndome activo, leyendo, criando a un niño pequeño e imaginando mundos.
  - Creo que los problemas personalmente interesantes que sirven a usuarios reales se quedan contigo más tiempo que cualquier obligación. Quiero que Kanka siga aquí en 10 años. Eso significa lanzar con cuidado y atención al detalle, y evitar que la deuda técnica te quite la pasión. Algunos días eso es más difícil que otros.

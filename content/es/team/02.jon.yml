name: Jon
role: Cofundador y Gerente de negocio
image: https://th.kanka.io/qj6BEWMKrn4D-9f5GMP_REpzsyQ=/200x200/smart/src/app/team/jon.jpg
experience: Solo juega como Guerrero

bio:
   - No llegué a Kanka desde el worldbuilding. Venía de un mundo de procesos rígidos, clientes exigentes y muy poco sentido de propósito. Vi lo que Jay había construido, vi el potencial, y lo convencí de convertirlo en nuestros trabajos principales. Kanka era una oportunidad, pero la pasión llegó después.
   - "Lo que me cambió fue la gente. Al principio noté algo que nunca había experimentado profesionalmente: usuarios que eran leales, amables y genuinamente comprensivos cuando las cosas no eran perfectas. Luego empecé a descubrir su creatividad a través de nuestros desafíos de worldbuilding, y honestamente, me pareció realmente increíble. Mundos enteros con sus propias historias, idiomas, conflictos, todos construidos con tanto cuidado. Todo eso vive sin pagar alquiler en mi cabeza."
   - Hoy en día me encargo del lado del storytelling de Kanka, buscando cómo explicar lo que hacemos y por qué importa. Creo que para quién construyes determina todo, y tuvimos suerte con la gente que apareció.
   - Cuando no estoy trabajando, cocino con lo que mi sistema hidropónico decide producir (se está yendo de las manos), juego demasiados videojuegos, y más adelante este año seré padre por primera vez, lo que sospecho va a recortar todo lo anterior.

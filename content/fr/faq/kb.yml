categories:
- category: "Général"
  faqs:
    - question: "Puis-je avoir plusieurs campagnes?"
      answer: |
        Oui. Tu peux créer ou rejoindre autant de campagnes que tu veux, gratuitement.

        Pour passer de l'une à l'autre, ouvre le **<i class="fa-regular fa-grid" aria-hidden="true"></i> sélecteur de campagne** en haut à droite. Le lien **Nouvelle campagne** se trouve sous la liste de tes campagnes.
    - question: "Puis-je créer mes propres catégories?"
      answer: |
        Oui, avec une [campagne premium](/fr/premium). Le nombre de [catégories personnalisées](https://docs.kanka.io/en/latest/features/campaigns/categories.html) dépend de l'abonnement.
    - question: "Comment faire une copie de ma campagne?"
      answer: |
        Lance un [export complet de ta campagne](https://docs.kanka.io/en/latest/features/campaigns/export.html), puis importe le fichier dans une nouvelle campagne.
    - question: "Comment relier deux entrées?"
      answer: |
        Dans l'éditeur, tape `@` suivi d'au moins trois caractères du nom de l'entrée. Choisis le résultat pour insérer le lien.

        Tu peux aussi changer le texte du lien, viser une sous-page ou filtrer les résultats. La [documentation sur les mentions](https://docs.kanka.io/en/latest/features/mentions.html) explique comment faire.
    - question: "Comment exporter ma campagne?"
      answer: |
        Tu peux exporter ta campagne une fois par jour. Tu obtiens un fichier ZIP qui contient tes données en JSON ou en Markdown, selon le format choisi.

        [Voir comment lancer un export](https://docs.kanka.io/en/latest/features/campaigns/export.html).
    - question: "À quoi sert d'épingler une relation ou une propriété?"
      answer: |
        Une relation ou une propriété épinglée apparaît à droite de la vue d'ensemble de son entrée. Pour l'y afficher, ouvre la relation ou la propriété en modification et active l'option d'épinglage.

        [Voir la documentation](https://docs.kanka.io/en/latest/features/profile-sidebar.html).
    - question: "Puis-je renommer « Familles » en « Clans »?"
      answer: |
        Oui, dans une [campagne premium](/fr/premium). Ouvre **Paramètres** > **Catégories**, puis clique sur le bouton de modification à côté du nom de la catégorie.

        [Voir la documentation sur les catégories](https://docs.kanka.io/en/latest/features/campaigns/categories.html).
    - question: "Puis-je synchroniser deux campagnes?"
      answer: |
        Kanka ne synchronise pas les entrées entre campagnes. Si deux groupes jouent dans le même monde, tu peux les réunir dans une seule campagne et séparer leurs quêtes et leurs notes à l'aide des étiquettes et des permissions.

        Si tu veux simplement reprendre des entrées dans une autre campagne, tu peux les [copier en masse](https://docs.kanka.io/en/latest/guides/bulk.html).
    - question: "Comment faire jouer plusieurs groupes dans le même monde?"
      answer: |
        Invite tout le monde dans la même campagne et crée un rôle pour chaque groupe. Tu peux ainsi décider ce que chacun voit sans devoir tenir plusieurs copies de ton monde.

        Une étiquette par groupe peut aussi t'aider à retrouver ses quêtes et ses notes.
    - question: "Comment utiliser les filtres?"
      answer: |
        Dans une liste d'entrées, tu peux affiner ta recherche avec ces filtres de texte.

        * `!...` exclut le texte qui suit le point d'exclamation.
        * `...!` cherche une correspondance exacte.
        * `!!` trouve les entrées où le champ est vide.

        Tu peux combiner plusieurs filtres avec `;`. Par exemple, `Alex;!Smith` cherche « Alex » et exclut « Smith ».

        Les filtres et le tri sont conservés tant que tu restes connecté. Quand un filtre est actif, tu peux le copier pour le réutiliser dans un widget du tableau de bord ou un favori.
    - question: "Comment afficher une liste sans les regroupements?"
      answer: |
        Tu peux passer d'une liste imbriquée à une liste simple dans tes paramètres personnels ou dans ceux de la campagne. Les paramètres de la campagne ont la priorité.

        [Voir la documentation sur les listes imbriquées](https://docs.kanka.io/en/latest/features/nested.html).
    - question: "À quoi sert un kit de propriétés?"
      answer: |
        Imaginons que tu veuilles noter la population, le climat et le niveau de criminalité de chaque ville. Crée un kit avec ces trois propriétés, puis applique-le à tes villes. Les champs sont ajoutés automatiquement. Il te reste à saisir leurs valeurs.

        [Voir le kit en vidéo](https://www.youtube.com/watch?v=qKnTpuePqUA).
- category: "Création de mondes"
  faqs:
    - question: "Où noter les dieux et les religions de mon monde?"
      answer: |
        Tu peux créer tes dieux comme des [personnages](https://docs.kanka.io/en/latest/entries/characters.html) et les religions comme des [organisations](https://docs.kanka.io/en/latest/entries/organisations.html). Pour retrouver tes divinités, ajoute une [étiquette](https://docs.kanka.io/en/latest/entries/tags.html) ou crée un [favori](https://docs.kanka.io/en/latest/advanced/bookmarks.html).

        Si tu veux leur consacrer une rubrique, crée une [catégorie personnalisée](https://docs.kanka.io/en/latest/features/campaigns/categories.html).
    - question: "Où noter les classes de personnage, comme rôdeur ou clerc?"
      answer: |
        Crée la classe dans la catégorie **Pouvoirs**. Ajoute ensuite les capacités de cette classe comme des sous-pouvoirs.
    - question: "Comment utiliser les propriétés?"
      answer: |
        Une propriété te permet de noter un détail dans un champ à part, par exemple les points de vie d'un personnage ou la population d'une ville. Tu peux y faire référence à une entrée avec `[entity:id]` ou à une autre propriété avec `{Level}`.

        Tu peux aussi faire des calculs. `{Level}*{Con}` multiplie les valeurs de ces deux propriétés. Pour arrondir vers le bas ou vers le haut, utilise `floor({Level}/3)` ou `ceil(({Con}*{Level})/2)`.

        Dans un kit, tu peux tirer une valeur au hasard. Saisis `1-100` pour un nombre compris entre 1 et 100 ou `London, Berlin, Rome, Zürich` pour une valeur de la liste. Kanka fait le tirage quand tu appliques le kit à l'entrée ou que tu l'enregistres.

        `{name}` reprend le nom de l'entrée, sauf si elle possède déjà une propriété qui s'appelle `name`.
    - question: "Puis-je reprendre une entrée d'une autre campagne?"
      answer: |
        Oui, si tu as accès à cette campagne, y compris si elle est publique. Ouvre le menu « … » de l'entrée pour la copier seule, ou [copie plusieurs entrées à la fois](https://docs.kanka.io/en/latest/guides/bulk.html).
- category: "Permissions"
  faqs:
    - question: "Comment cacher certaines informations à mes joueurs?"
      answer: |
        Après avoir invité tes joueurs, attribue-leur un rôle et choisis ce qu'ils peuvent voir ou modifier. Si tu veux partager la fiche d'un personnage tout en gardant ses intentions secrètes, ajoute un **Article** privé à sa vue d'ensemble.

        [Voir l'explication en vidéo](https://www.youtube.com/watch?v=ikNPzNgjYmg&feature=emb_logo).
    - question: "Qui peut voir ma campagne?"
      answer: |
        Une campagne est privée par défaut. Seules les personnes que tu invites peuvent la consulter, y compris les membres de l'équipe Kanka. Si tu rends ta campagne publique, tout le monde peut consulter ce que tu as choisi de publier.
- category: "Calendriers"
  faqs:
    - question: "Comment afficher l'âge d'un personnage?"
      answer: |
        Sur sa fiche, ouvre **Rappels** et ajoute une date de type **Naissance** ou **Décès** dans le calendrier de ta campagne. Avec la date de naissance seule, Kanka affiche l'âge actuel. Avec les deux dates, il affiche l'âge au moment du décès. Si tu ne saisis que le décès, il indique le nombre d'années écoulées depuis.

        Les lieux et les organisations disposent aussi d'un rappel de type **Fondation**.

        [Voir la documentation sur les âges](https://docs.kanka.io/en/latest/advanced/age.html?highlight=sidebar).
- category: "Cartes et lieux"
  faqs:
    - question: "Quels formats d'image puis-je utiliser pour une carte?"
      answer: |
        Tu peux ajouter une image PNG, JPG, WebP ou SVG. Une fois la carte créée, tu peux y ajouter des couches, des groupes et des marqueurs liés à des entrées de ta campagne.

        [Voir la documentation sur les cartes](https://docs.kanka.io/en/latest/entries/maps.html).
    - question: "Comment rendre une carte interactive?"
      answer: |
        Place des marqueurs sur ta carte et relie-les aux fiches des lieux concernés. Tu peux choisir une épingle, un cercle, une étiquette ou un polygone. Garde un marqueur privé si ton groupe n'a pas encore découvert ce qu'il indique.

        [Voir la documentation sur les cartes](https://docs.kanka.io/en/latest/entries/maps.html).
- category: "Compte"
  faqs:
    - question: "Comment supprimer mon compte?"
      answer: |
        Ouvre les [paramètres de ton compte](https://app.kanka.io/settings/account#account-deletion) et descends jusqu'à la section de suppression. Cette action supprime **définitivement** ton compte et les campagnes dont tu es le seul membre.
    - question: "Comment supprimer une campagne?"
      answer: |
        Dans le menu latéral de la campagne, ouvre **Paramètres**, puis **Suppression**. Cette action efface **définitivement** la campagne, ses données et ses images.
    - question: "Comment lier mon compte Kanka à Discord?"
      answer: |
        Dans tes paramètres, ouvre [Applications](https://app.kanka.io/settings/apps) et clique sur **Connecter** à côté de Discord. Ton compte rejoint le [serveur de Kanka](/go/discord) et reçoit les rôles qui correspondent à ton abonnement.
- category: "Tarifs"
  faqs:
    - question: "Est-ce que Kanka restera gratuit?"
      answer: |
        Oui. Tu peux continuer à créer des campagnes et à utiliser les outils de base gratuitement. Si tu veux nous soutenir, un abonnement te permet notamment de voter sur la feuille de route et d'activer les [campagnes premium](/fr/premium).
    - question: "Comment fonctionne l'accès anticipé?"
      answer: |
        Si tu as un abonnement, tu peux essayer les fonctionnalités en accès anticipé pendant 30 jours avant leur sortie pour tout le monde.
    - question: "Que deviennent mes données si ma campagne repasse en mode standard?"
      answer: |
        Les données liées au premium restent enregistrées. Elles sont masquées tant que la campagne est en mode standard et réapparaissent si tu réactives le premium.
    - question: "Kanka a-t-il accès à mes données de carte bancaire?"
      answer: |
        [Stripe](https://stripe.com) gère les paiements et la facturation. Stripe nous transmet la marque de ta carte, sa date d'expiration et les quatre derniers chiffres. Nous pouvons ainsi te prévenir avant son expiration pour que tu puisses la mettre à jour.
- category: "Autre"
  faqs:
    - question: "Puis-je utiliser Kanka sur mon téléphone?"
      answer: |
        Oui, depuis le navigateur de ton téléphone. L'interface s'adapte aux petits écrans et tu y retrouves les mêmes fonctionnalités.
    - question: "Comment Kanka va-t-il évoluer?"
      answer: |
        On veut que tu puisses continuer à utiliser Kanka avec les règles de ton choix. La communauté peut partager ses thèmes, fiches et autres créations dans la [bibliothèque de plugins](https://plugins.kanka.io).
    - question: "À quelle fréquence Kanka sauvegarde-t-il mes données?"
      answer: |
        Nous faisons deux sauvegardes par jour. Nos propres campagnes sont hébergées au même endroit que les tiennes.
    - question: "Comment signaler un bug?"
      answer: |
        Rejoins-nous sur [Discord](/go/discord) et décris le problème dans le salon `#error-and-bugs`.
    - question: "Comment puis-je aider?"
      answer: |
        Si tu veux aider à traduire Kanka, tester une nouveauté ou répondre aux questions des personnes qui débutent, rejoins-nous sur [Discord](/go/discord). Tu peux aussi parler de Kanka à ton groupe de jeu.

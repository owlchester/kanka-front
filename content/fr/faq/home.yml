items:
  - id: free
    q: "Le plan gratuit est vraiment gratuit, ou juste un essai?"
    a: "Gratuit pour toujours. Campagnes et entrées illimitées, toutes les fonctionnalités de base, sans carte de crédit. Beaucoup de MJs ne passent jamais à la version payante. Les abonnements payants ajoutent des campagnes premium, des uploads plus importants et quelques extras"
  - id: ownership
    q: "Est-ce que je peux récupérer le contenu de ma campagne?"
    a: "Oui. Ton monde t'appartient et tu peux exporter toute ta campagne quand tu veux."
  - id: system
    q: "Est-ce qu'il faut jouer à D&D pour utiliser Kanka?"
    a: "Tu peux utiliser Kanka avec n'importe quel jeu de rôle, même avec un système maison. Tu peux aussi t'en servir pour écrire ou créer un univers, sans y jouer."
  - id: secrets
    q: "Est-ce que je peux cacher des informations à mes joueurs?"
    a: "Oui. Quand tu invites tes joueurs, tu choisis ce que chacun peut voir et modifier. Tu peux par exemple leur montrer la fiche d'un personnage et garder ses véritables intentions pour toi."
  - id: started
    q: "Combien de temps faut-il pour commencer?"
    a: "Quelques minutes suffisent. Crée un compte, ajoute deux ou trois personnages et lieux, puis relie-les en tapant @ suivi de leur nom."

bio:
   - Je ne suis pas venu à Kanka par le worldbuilding. Je venais d'un monde de processus rigides, de clients exigeants et de très peu de sens à ce que je faisais. J'ai vu ce que Jay avait construit, j'ai vu le potentiel, et je l'ai convaincu d'en faire nos jobs principaux. Kanka était une opportunité, mais la passion est venue plus tard.
   - "Ce qui m'a changé, c'est les gens. Très tôt, j'ai remarqué quelque chose que je n'avais jamais vécu professionnellement: des utilisateurs loyaux, gentils, et vraiment indulgents quand les choses n'étaient pas parfaites. Puis j'ai commencé à découvrir leur créativité à travers nos défis de worldbuilding, et honnêtement, je trouvais ça vraiment cool. Des mondes entiers avec leurs propres histoires, langues, conflits, tous construits avec tant de soin. Tout ça vit loyer gratuit dans ma tête."
   - Ces jours-ci, je gère le côté storytelling de Kanka, en cherchant comment expliquer ce qu'on fait et pourquoi ça compte. Je pense que pour qui tu construis façonne tout, et on a eu de la chance avec les gens qui se sont présentés.
   - Quand je ne travaille pas, je cuisine avec ce que mon installation hydroponique décide de produire (ça devient incontrôlable), je joue à trop de jeux vidéo, et plus tard cette année je serai parent pour la première fois, ce qui va sûrement empiéter sur tout le reste.

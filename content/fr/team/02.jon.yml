name: Jon
role: Cofondateur, chargé de la communication et de la gestion
image: /images/members/jon.png
experience: Joue toujours un guerrier

bio:
  - Avant Kanka, je travaillais dans un milieu où les procédures étaient rigides, les clients exigeants et où je me demandais souvent à quoi servait mon travail. En voyant ce que Jay avait fait, je l'ai convaincu qu'on pouvait en faire notre métier. J'y ai d'abord vu une occasion de changer de boulot. Le reste est venu avec le temps.
  - Ce sont les gens qui m'ont donné envie de rester. Dès le début, ils nous ont soutenus et se sont montrés patients quand tout ne marchait pas comme prévu. Puis j'ai vu ce qu'ils créaient pour nos concours. Des mondes entiers, avec leurs histoires, leurs langues et leurs conflits. Je repense encore à certains d'entre eux.
  - Aujourd'hui, je m'occupe surtout de raconter ce qu'on fait chez Kanka et à quoi ça sert. Les gens qui utilisent un outil influencent ce qu'il devient. On a eu de la chance avec ceux qui nous ont rejoints.
  - En dehors du boulot, je cuisine avec ce qui pousse dans mon potager hydroponique, qui commence à prendre un peu trop de place. Je joue aussi à trop de jeux vidéo. Je vais devenir père pour la première fois cette année. Je me doute que je vais devoir revoir mon emploi du temps.

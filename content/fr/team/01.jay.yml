name: Jay
role: Fondateur & Développeur principal
image: https://th.kanka.io/3gGetooEqoGcA-NFOPvu2xYX980=/200x200/smart/src/app/team/jay2.jpeg
experience: Le MJ pour toujours

bio:
  - J'ai créé Kanka parce que j'en avais assez de passer la moitié de mon temps de worldbuilding à mettre à jour des logiciels wiki et l'autre moitié à vraiment créer. Sept ans plus tard, je suis toujours là, je continue à livrer, toujours obsédé par trouver le bon équilibre entre profondeur et simplicité. Les bons outils n'ont pas besoin de tout faire, juste les choses qui comptent, et ils doivent les faire bien.
  - Je construis Kanka avec une technologie qui n'est pas des plus brillantes, mais dont je sais qu'elle fonctionne et qui ne va pas me réveiller à 3h du matin parce que quelque chose a planté. Je passe le reste de mon temps à rester actif, à lire, à élever un tout-petit, et à imaginer des mondes.
  - Je pense que les problèmes personnellement intéressants qui servent de vrais utilisateurs restent avec toi plus longtemps que l'obligation ne le fera jamais. Je veux que Kanka soit là dans 10 ans. Cela signifie livrer avec soin et attention aux détails, et éviter que la dette technique ne vide la passion. Certains jours, c'est plus difficile que d'autres.

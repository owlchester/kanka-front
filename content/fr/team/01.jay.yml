name: Jay
role: Fondateur et développeur principal
image: /images/members/jay.png
experience: MJ à vie

bio:
  - J'ai créé Kanka parce que je passais autant de temps à entretenir mon wiki qu'à imaginer mon monde. Des années plus tard, je développe toujours Kanka et je me pose encore la même question. Comment donner assez de liberté pour créer des mondes complexes tout en gardant l'outil simple à utiliser?
  - Pour développer Kanka, je m'appuie sur des outils fiables que je connais bien. Ça m'évite de devoir réparer une panne à 3 h du matin. En dehors du boulot, je fais du sport, je lis, je m'occupe de mon enfant et j'imagine d'autres mondes.
  - Ce qui me motive, c'est de résoudre des problèmes qui m'intéressent et qui se posent à des gens qui utilisent Kanka. J'ai envie que Kanka soit encore là dans dix ans. Alors j'essaie de soigner les détails à chaque mise à jour et de garder le code facile à entretenir. Certains jours, c'est plus simple que d'autres.

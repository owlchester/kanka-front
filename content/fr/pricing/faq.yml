items:
  - id: payments
    q: "Comment puis-je payer?"
    a: "Nous acceptons la plupart des cartes de crédit et de débit, dont Visa, Mastercard et American Express. Pour un abonnement annuel, tu peux aussi payer avec PayPal."
  - id: info
    q: "Quelles données de paiement sont conservées?"
    a: "Stripe traite tes paiements. Nous conservons seulement quelques informations sur ton moyen de paiement, notamment pour te prévenir avant l'expiration de ta carte. Tu peux ainsi la mettre à jour sans interrompre ton abonnement."
  - id: cancel
    q: "Que se passe-t-il si je résilie mon abonnement?"
    a: "Tu gardes tes avantages jusqu'à la fin de la période que tu as déjà payée."
  - id: resub
    q: "Est-ce que je retrouve mes données si je me réabonne?"
    a: "Quand ton abonnement prend fin, tu perds l'accès aux fonctionnalités payantes. Nous conservons les données associées et tu les retrouves si tu te réabonnes."
  - id: refund
    q: "Comment demander un remboursement?"
    a: "Tu as 14 jours pour demander le remboursement de ton abonnement annuel. Écris-nous à <a href=\"mailto:hello@kanka.io\" class=\"link link-purple\">hello@kanka.io</a>. Tu n'as pas besoin de te justifier."
  - id: gift
    q: "Puis-je offrir un abonnement?"
    a: "L'abonnement reste lié à ton compte. Tu peux l'utiliser pour activer le premium sur toute campagne à laquelle tu as accès, même si tu n'en fais pas partie."
